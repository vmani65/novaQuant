server.port=8080

# --- Default profile when none is specified at runtime ---
# java -jar novaquant-v3.jar                          → uses 'live' (real Kite orders)
# java -jar novaquant-v3.jar --spring.profiles.active=mock  → uses 'mock' (Postman testing)
spring.profiles.default=live

# --- Kite API keys loaded from gitignored file ---
# Copy application-credentials.properties.template → application-credentials.properties and fill in values
spring.config.import=optional:classpath:application-credentials.properties

# --- SQLite datasource ---
spring.datasource.url=jdbc:sqlite:C:/novaquant/data/sqlite/signals.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Logging ---
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.file.name=logs/novaquant-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

server.servlet.session.tracking-modes=cookie
