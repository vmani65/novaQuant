server.port=8080

# --- Default profile when none is specified ---
# java -jar nqCore-2026.05.jar                         → 'live' (real Kite orders)
# java -jar nqCore-2026.05.jar --spring.profiles.active=mock        → MockKiteGateway, signals.db
# java -jar nqCore-2026.05.jar --spring.profiles.active=mock,test   → MockKiteGateway, signals_test.db
spring.profiles.default=live

# --- Kite API keys loaded from gitignored file ---
# Copy application-credentials.properties.template → application-credentials.properties and fill in values
spring.config.import=optional:classpath:application-credentials.properties

# --- SQLite datasource ---
# busy_timeout=5000: sqlite-jdbc will internally retry on SQLITE_BUSY for up to 5s
# instead of throwing immediately. Needed because D₂'s WS-await drops rollover wall-clock
# from ~500ms to ~100ms, exposing a pre-existing race between markRolloverComplete()
# and post-trade async fill-retrieval transactions.
spring.datasource.url=jdbc:sqlite:C:/novaquant/data/sqlite/signals.db?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- nQTicker open buffer (9:15 AM long exit delegation) ---
nq.ticker.url=http://localhost:9192

# --- Order execution ---
# true  = graduated LIMIT walk (mid → walk → MARKET fallback) for orders < MAX_SIZE_PER_ORDER
# false = pure MARKET (legacy, eats full spread)
# MARKET fallback fires on every failure path so a leg can never end up un-hedged.
# Auto-slice orders (> MAX_SIZE_PER_ORDER) bypass this entirely. See PositionUtil.placeGraduatedLimit.
order.execution.use-limit-walk=true

# --- Patient execution (PATIENT_EXECUTION_PLAN.md) ---
# LONG_MONTHLY thin-book exits: fair-anchored resting LIMIT, minutes-scale concession schedule,
# hard concession cap, NO MARKET fallback on wide spreads; unfilled at deadline → leg rests and
# goes PENDING_CLOSE (reconciler owns it). Tunables (step-delays-ms, concession-fractions,
# max-concession-pts/pct, sane-spread-pct, cutoff, deadline-action) default per plan §5 and can
# be overridden here as order.execution.patient.* keys. OFF until promoted per §7.0 protocol.
order.execution.patient.enabled=false

# Interleaved monthly flip (plan §4): close one slice patiently → confirm → open the same qty
# aggressively, |closed−opened| ≤ 1 slice. Requires patient.enabled=true to take effect
# (MonthlyFlipService.interleaveAvailable). Tunables: monthly-flip-slice-lots (default 1),
# monthly-flip-window-ms (default 600000 = 10 min flip budget).
order.execution.monthly-flip-interleave.enabled=false

# --- Virtual threads (Java 25) ---
# Tomcat request handlers + Spring @Async + TaskScheduler on virtual threads.
# Tomcat handler threads log as "tomcat-handler-N" instead of "http-nio-N".
spring.threads.virtual.enabled=true

server.servlet.session.tracking-modes=cookie
