# ============================================================
# Mock profile — safe local testing, NO real Kite calls made
# ============================================================
# Activate with:
#   java -jar novaquant-v3.jar --spring.profiles.active=mock
#
# All Kite API calls are intercepted by MockKiteGateway.
# No real orders placed. MOCK-* order IDs appear in logs and DB.

# Dummy credentials override the real ones from application-credentials.properties.
# MockKiteGateway ignores them but @Value binding in KiteAuthService requires them.
kite.user-id=MOCK-USER
kite.api-key=mock-api-key
kite.api-secret=mock-api-secret
